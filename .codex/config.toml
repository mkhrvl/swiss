[mcp_servers.shadcn]
command = "pnpm"
args = ["exec", "shadcn", "mcp"]
# Use an absolute path so MCP startup does not depend on the client's directory.
cwd = "/home/mkrevil/swiss/apps/pwa"

[mcp_servers.playwright]
command = "pnpm"
args = ["dlx", "@playwright/mcp@0.0.83", "--browser", "chromium", "--headless", "--isolated", "--output-dir", "artifacts/playwright-mcp"]
cwd = ".."
startup_timeout_sec = 60

[mcp_servers.nuget]
command = "dnx"
args = ["NuGet.Mcp.Server@1.4.16", "--source", "https://api.nuget.org/v3/index.json", "--yes"]
cwd = ".."
startup_timeout_sec = 60
